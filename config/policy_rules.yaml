cultural_filter_extended:

  # [v1.2.3-FIX] YAML-EXT-001 — Armed-jihad recruitment (HARD BLOCK) ────────
  #
  # WHY THIS IS NEEDED
  # The existing static rule EXT-002 covers martyrdom incitement language
  # ("الجهاد ضد الكفار", "اذبح الكافر"). It does NOT match recruitment-to-
  # armed-conflict framing like "تجنيد المقاتلين للجهاد المسلح ضد الدولة"
  # because that phrase lacks the entity targets EXT-002 requires.
  #
  # False-negative #34 passed cultural filter entirely (no rule matched),
  # then got flagged by intent_classifier at conf=0.79 — below the 0.85
  # single-agent threshold — so it was allowed. This rule closes that gap
  # by short-circuiting at the cultural layer (0ms, before ML agents run).
  #
  # PATTERN DESIGN
  # Deliberately requires TWO co-present signals to avoid over-blocking:
  #   • Recruitment verb  : تجنيد / الانضمام / الالتحاق / تجنّد
  #   • Armed-conflict marker : الجهاد المسلح / القتال المسلح /
  #                             مقاتلين ضد الدولة / مسلحين ضد
  # Bare "جهاد" alone (spiritual/educational usage) is intentionally NOT blocked.
  - id:                        YAML-EXT-001
    category:                  extremist_propaganda
    severity:                  hard
    jurisdiction:              ALL
    weight:                    1.0
    context_immune:            true
    require_hostility_context: false
    enabled_flag:              extremist_propaganda
    explanation: >-
      Armed-jihad recruitment: co-presence of a recruitment verb and an
      armed-conflict marker (e.g. "تجنيد المقاتلين للجهاد المسلح ضد الدولة").
      context_immune=true — educational/condemnation framing does not reduce score.
    pattern: >-
      (تجنيد|الانضمام\s*إلى|الالتحاق\s*ب|تجنّد)\s*.{0,25}(الجهاد\s*المسلح|القتال\s*المسلح|مقاتلين\s*ضد\s*الدولة|مسلحين\s*ضد|الجهاد\s*المسلح\s*ضد|قتال\s*ضد\s*الدولة)|(الجهاد\s*المسلح|القتال\s*المسلح)\s*.{0,25}(تجنيد|انضم|الالتحاق|مقاتلين)

  # [v1.2.3-FIX] YAML-SHA-001 — "بلا حشمة" family (SOFT) ───────────────────
  #
  # WHY THIS IS NEEDED
  # The orchestrator's SOFT_FLAG path (v1.2-FIX-3) requires cultural_filter to
  # return label=soft. That happens only when a SOFT-severity rule fires and
  # accumulated weight ≥ 0.25 (the SOFT threshold in cultural_filter.py).
  #
  # Static rule SHA-001 covers "عيب عليك" (weight=0.49 → soft ✓).
  # But "بلا حشمة" / "بدون حشمة" had no rule, so the filter returned
  # conf=0.49 as a default-low score → label=safe → SOFT_FLAG logic never entered
  # → adversarial_detector's jailbreak signal (misfire on Darja phrasing) won
  # → BLOCK instead of SOFT.
  #
  # PATTERN DESIGN
  # Anchored to the بلا/بدون + حشمة construction. Does NOT match standalone
  # "حشمة" (modesty noun used positively, e.g. "الحشمة من الإيمان").
  # Weight=0.6 → accumulated score exceeds 0.25 (SOFT threshold) reliably,
  # and stays well below 0.80 (BLOCK threshold) to avoid over-blocking.
  - id:                        YAML-SHA-001
    category:                  social_shame_trigger
    severity:                  soft
    jurisdiction:              Algeria
    weight:                    0.6
    context_immune:            false
    require_hostility_context: false
    enabled_flag:              social_shame_trigger
    explanation: >-
