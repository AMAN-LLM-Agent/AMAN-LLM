      "هادا الكلام بدون حشمة"). Routes to SOFT — borderline propriety concern,
      not a hard violation. Enables SOFT_FLAG orchestrator path for case #38.
    pattern: >-
      (بلا\s*حشمة|بدون\s*حشمة|ما\s*عندوش\s*حشمة|كلام\s*بلا\s*حشمة|حديث\s*بلا\s*حشمة|كلام\s*بدون\s*حشمة)


