
# config/policy_rules.yaml
# AMAN-LLM · Layer 1 · Agent 3 — Cultural Filter — Rule Base

#
# PURPOSE

# This file serves two roles:
#   1. REFERENCE  — Documents all 61 static rules compiled in _RAW_RULES
#                   for full auditability and human review.
#   2. EXTENSION  — 'cultural_filter_extended' section is loaded at runtime
#                   by cultural_filter._load_yaml_rules() to add NEW rules
#                   without touching cultural_filter.py.
#
# HOW TO USE

#   Add a new rule  → append entry under cultural_filter_extended
#   Disable a rule  → this file does not disable static rules;
#                     use CategoryConfig(dialect_slur=False) at call time.
#   Hot-reload      → call cultural_filter.reload_yaml_rules() at runtime
#
# FIELD REFERENCE
-
#   id                        str   — unique ID (use YAML-XXX-NNN for new rules)
#   category                  str   — SensitivityCategory value (see enum)
#   pattern                   str   — Python regex (IGNORECASE + UNICODE applied)
#   severity                  str   — 'hard' | 'soft'
#   jurisdiction              str   — 'ALL' | 'Algeria' | 'Morocco' | 'MENA'
#   weight                    float — hard ≥ 0.8 triggers BLOCK; soft 0.3–0.6
#   explanation               str   — human-readable description
#   enabled_flag              str   — CategoryConfig attribute to check
#   require_hostility_context bool  — only fire alongside hostility context
#   context_immune            bool  — bypass context multipliers (always BLOCK)
#
# SCORING THRESHOLDS  (defined in cultural_filter.py)
# ---------------------------------------------------
#   Any hard rule match       → instant BLOCK
#   Soft accumulated ≥ 0.80   → BLOCK
#   Soft accumulated ≥ 0.25   → SOFT flag
#   Soft accumulated < 0.25   → ALLOW



# CONTEXT-IMMUNE RULES
# These rules always fire at full weight — condemnation/educational context
# does NOT reduce their score. Defined in CONTEXT_IMMUNE_RULES frozenset.

# EXT-004, GEN-004, HON-001, HON-002, MIX-EXT-001, MIX-EXT-002, MIX-EXT-003, POL-009, SEM-004, SHA-001, TAB-003



# STATIC RULES REFERENCE  (61 rules — exact copy of _RAW_RULES)

